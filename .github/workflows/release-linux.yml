name: publish-linux-release

on:
  push:
    branches: [linux-cmake-port]
    paths:
      - ".github/workflows/release-linux.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="linux-v1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          gh release create "$TAG" \
            --target "${GITHUB_SHA}" \
            --title "Festival Virtual Singer — Linux 1.0.0" \
            --notes "First native Linux release of Festival Virtual Singer.

          Highlights:
          - CMake build system
          - wxWidgets on Linux
          - ALSA realtime audio backend
          - native Festival command-line bridge
          - Singer sequence playback and WAV export
          - note preview
          - Sample Pool preview and waveform editor
          - manual and automatic slicing
          - Slicer audition and Piano Roll playback
          - project save/load and offline Slicer WAV rendering

          Build instructions are included in README.md and README-LINUX.md.

          This release is built from the linux-cmake-port branch. The Windows main branch remains separate and unchanged."
